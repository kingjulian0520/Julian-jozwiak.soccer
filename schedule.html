<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julian Jozwiak | Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <div class="brand-dropdown">
        <button class="brand brand-toggle" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="ball">⚽</span> Julian Jozwiak <span class="brand-caret">⌄</span>
        </button>
        <div class="brand-menu">
          <a href="index.html">Home</a>
          <a href="index.html#profile">Profile</a>
        </div>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html#academics">ACADEMICS</a></li>
        <li><a href="index.html#team-history">TEAM HISTORY</a></li>
        <li><a href="schedule.html" class="active">SCHEDULE</a></li>
        <li><a href="achievements.html">ACHIEVEMENTS</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="schedule-season-select">
        <button class="hero-eyebrow schedule-season-toggle" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="schedule-season-label">📅 GBS 2026 Schedule</span>
          <span class="schedule-season-caret">⌄</span>
        </button>
        <div class="schedule-season-menu">
          <button type="button" class="schedule-season-option active" data-season="gbs-2026">📅 GBS 2026 Schedule</button>
          <button type="button" class="schedule-season-option" data-season="important-games">⭐ Important Games</button>
          <button type="button" class="schedule-season-option" data-season="ecnl-phoenix-2026">📅 ECNL Phoenix 2026</button>
          <button type="button" class="schedule-season-option" data-season="ecnl-2027">📅 ECNL 2027</button>
        </div>
      </div>
      <p class="schedule-season-subtitle">Glenbrook South Varsity, 2026-27 &mdash; use the arrows to browse the season.</p>
    </section>

    <section class="page-content">
      <div class="schedule-viewer">
        <div class="schedule-date"></div>
        <div class="schedule-row">
          <button class="schedule-arrow schedule-arrow-left" type="button" aria-label="Previous game">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div class="schedule-box">
            <div class="schedule-star" aria-hidden="true">⭐</div>
            <div class="schedule-note"></div>
            <div class="schedule-opponent"></div>
            <div class="schedule-opp-rank"></div>
            <div class="schedule-location"></div>
            <div class="schedule-our-record"></div>
            <div class="schedule-result"></div>
          </div>
          <button class="schedule-arrow schedule-arrow-right" type="button" aria-label="Next game">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    &copy; 2026 Julian Jozwiak
  </footer>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/schedule.js"></script>
</body>
</html>
